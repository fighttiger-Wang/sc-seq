<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#172033;--muted:#607086;--navy:#17365d;--blue:#2f6f9f;--red:#b42318;--red-soft:#fff0ee;--green:#3f6f52;--green-soft:#edf7f0;--amber:#9a5b13;--amber-soft:#fff7e6;--line:#dbe3ec;--panel:#fff;--page:#f4f6f8;--cold:#235fa4;--z-progress:20;--z-dialog:30}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.72 "Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;text-rendering:optimizeLegibility}a{color:inherit}img{display:block;max-width:100%}button{font:inherit}
    .reading-progress{position:fixed;z-index:var(--z-progress);inset:0 0 auto;height:3px;pointer-events:none}.reading-progress i{display:block;width:100%;height:100%;background:var(--blue);transform:scaleX(0);transform-origin:left center}
    .shell{max-width:1420px;margin:0 auto;padding:24px;display:grid;grid-template-columns:245px minmax(0,1fr);gap:22px}.sidebar{position:sticky;top:18px;align-self:start;background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(23,54,93,.06)}
    .brand{font-weight:800;color:var(--navy);font-size:17px;padding-bottom:13px;border-bottom:1px solid var(--line);text-wrap:balance}.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:4px}.toc{list-style:none;margin:14px 0 0;padding:0}.toc li+li{margin-top:3px}.toc a{display:block;text-decoration:none;color:#44556a;border-radius:8px;padding:7px 9px;font-size:13px}.toc a:hover,.toc a:focus-visible{background:#edf3f8;color:var(--navy);outline:none}.toc a.is-active{background:#e7f0f7;color:var(--navy);font-weight:700;box-shadow:inset 3px 0 0 var(--blue)}
    .content{min-width:0}.hero{background:var(--navy);color:#fff;border-radius:16px;padding:34px 38px;box-shadow:0 4px 14px rgba(23,54,93,.16)}.eyebrow{font-size:12px;font-weight:700;color:#c8d9e8;text-transform:uppercase}h1{font-size:31px;line-height:1.25;margin:7px 0 11px;text-wrap:balance}.hero p{margin:5px 0;color:#dbe8f2;text-wrap:pretty}.hero-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.chip{border:1px solid rgba(255,255,255,.32);border-radius:999px;padding:5px 10px;font-size:12px;color:#fff}
    .kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 17px}.kpi strong{display:block;color:var(--navy);font-size:24px;line-height:1.25;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:12px}
    .section{scroll-margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:25px;margin:16px 0;box-shadow:0 2px 8px rgba(23,54,93,.04)}h2{font-size:21px;line-height:1.35;margin:0 0 14px;color:var(--navy);text-wrap:balance}h3{font-size:16px;margin:20px 0 8px;color:#294d6f;text-wrap:balance}p,li{overflow-wrap:anywhere;text-wrap:pretty}.lead{font-size:16px;color:#2e4054}.section-eyebrow{margin-bottom:4px;color:var(--blue);font-weight:700;font-size:12px}
    .callout{border-left:4px solid var(--blue);background:#edf4f9;border-radius:8px;padding:13px 15px;margin:12px 0}.callout.danger{border-left-color:var(--red);background:var(--red-soft)}.callout.warning{border-left-color:#d58b2b;background:var(--amber-soft)}.callout.success{border-left-color:var(--green);background:var(--green-soft)}.callout strong{display:block;color:var(--navy);margin-bottom:3px}.callout p{margin:0}
    .insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.insight{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fbfcfd}.insight .value{display:block;color:var(--navy);font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}.insight strong{display:block;margin-top:3px;color:#294d6f}.insight p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.figure-grid.single{grid-template-columns:1fr}figure{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:#fff;overflow:hidden}.figure-media{background:#fafbfc;padding:12px;display:flex;align-items:center;justify-content:center;min-height:250px}.figure-media button{width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.figure-media button:focus-visible{outline:3px solid #79a9ce;outline-offset:3px}.figure-media img{margin:auto;max-height:680px;object-fit:contain}.figure-wide .figure-media{overflow:auto;justify-content:flex-start}.figure-wide .figure-media button{min-width:900px}figcaption{border-top:1px solid var(--line);padding:14px 16px;background:#fff}figcaption strong{display:block;color:var(--navy);margin-bottom:4px}figcaption span{display:block;color:var(--muted);font-size:13px}.source{display:inline-block;margin-top:7px;color:#66788d;font-size:11px}
    .table-title{font-weight:700;color:var(--navy);margin:16px 0 8px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px 10px;border-bottom:1px solid #e6ebf1;text-align:left;vertical-align:top;white-space:nowrap;font-variant-numeric:tabular-nums}thead th{background:var(--navy);color:#fff;position:sticky;top:0;z-index:1}.table-note{color:var(--muted);font-size:12px;margin-top:7px}.citations{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:5px;vertical-align:middle}.citation{color:var(--blue);font-size:12px;font-weight:700;text-decoration:none;border-bottom:1px solid #a9c5d9}.citation:hover{text-decoration:none;border-bottom-color:var(--blue)}.citation:focus-visible{outline:3px solid #79a9ce;outline-offset:2px}
    .conclusion{font-size:16px;background:#edf4f9;border:1px solid #cbdde9;border-radius:10px;padding:17px}.foot{color:var(--muted);font-size:12px;margin:18px 3px 40px}.back{display:inline-block;margin-top:13px;color:var(--blue);font-size:12px;text-decoration:none}
    dialog.image-viewer{z-index:var(--z-dialog);width:min(96vw,1500px);height:min(94vh,1000px);padding:18px;border:0;border-radius:10px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.35)}dialog.image-viewer::backdrop{background:rgba(16,29,46,.92)}.viewer-bar{display:flex;justify-content:flex-end;margin-bottom:10px}.viewer-close{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--navy);font-weight:700;padding:9px 13px;cursor:pointer}.viewer-close:hover{background:#edf3f8}.viewer-close:focus-visible{outline:3px solid #79a9ce;outline-offset:3px}.viewer-body{height:calc(100% - 50px);overflow:auto;display:grid;place-items:center;background:#fafbfc}.viewer-body img{max-width:none;max-height:none;width:auto;height:auto;background:#fff}
    @media(max-width:1050px){.shell{grid-template-columns:1fr}.sidebar{position:static}.toc{columns:2}.figure-grid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.shell{padding:10px}.hero{padding:25px 21px}h1{font-size:25px}.section{padding:19px}.toc{columns:1}.kpis,.insight-grid{grid-template-columns:1fr}.figure-wide .figure-media button{min-width:700px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    @media print{body{background:#fff}.reading-progress,dialog.image-viewer{display:none!important}.shell{display:block;max-width:none;padding:0}.sidebar{display:none}.hero,.section,.kpi,figure{box-shadow:none;break-inside:avoid}.figure-wide .figure-media button{min-width:0}.foot{margin-bottom:0}}
  </style>
</head>
<body id="top">
  <div class="reading-progress" aria-hidden="true"><i></i></div>
  <div class="shell">
    <aside class="sidebar" aria-label="报告目录">
      <div class="brand">{{PROJECT_LABEL}}<small>科学结果与证据链导航</small></div>
      <ol class="toc">{{TOC}}</ol>
    </aside>
    <main class="content">{{CONTENT}}</main>
  </div>
  <dialog class="image-viewer" aria-label="分析图片放大预览">
    <div class="viewer-bar"><button class="viewer-close" type="button">关闭预览</button></div>
    <div class="viewer-body"><img alt="放大的分析图片"></div>
  </dialog>
  <script>
    (()=>{
      const progress=document.querySelector('.reading-progress i');
      const links=[...document.querySelectorAll('.toc a[href^="#"]')];
      const sections=links.map(link=>document.querySelector(link.getAttribute('href'))).filter(Boolean);
      const updateProgress=()=>{const room=document.documentElement.scrollHeight-window.innerHeight;const ratio=room>0?Math.min(1,Math.max(0,window.scrollY/room)):0;progress.style.transform=`scaleX(${ratio})`};
      window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
      if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;for(const link of links)link.classList.toggle('is-active',link.getAttribute('href')===`#${entry.target.id}`)}},{rootMargin:'-18% 0px -70% 0px'});for(const section of sections)observer.observe(section)}
      const dialog=document.querySelector('.image-viewer');const viewerImage=dialog.querySelector('img');const closeButton=dialog.querySelector('.viewer-close');let returnFocus=null;
      for(const button of document.querySelectorAll('[data-image-viewer]'))button.addEventListener('click',()=>{returnFocus=button;const source=button.querySelector('img');viewerImage.src=source?.src||'';viewerImage.alt=source?.alt||'放大的分析图片';dialog.showModal();closeButton.focus()});
      closeButton.addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});dialog.addEventListener('close',()=>{viewerImage.removeAttribute('src');returnFocus?.focus()});
    })();
  </script>
</body>
</html>
