<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{TITLE}}</title>
  <style>
    :root{--ink:#1e2a3a;--muted:#5f6f82;--burgundy:#8b0000;--heading:#2c3e50;--line:#a0aec0;--soft-line:#d8dee6;--paper:#fff;--screen:#eef1f4;--band:#f8f9fa;--table-head:#e9ecef;--blue:#2b6cb0;--blue-soft:#f0f7ff;--amber:#9a5b13;--amber-soft:#fff7e6;--red:#b42318;--red-soft:#fff0ee;--green:#3f6f52;--green-soft:#edf7f0;--z-progress:20;--z-dialog:30}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--screen);color:var(--ink);font:15px/1.75 "Songti SC","STSong","SimSun","Times New Roman",serif;text-rendering:optimizeLegibility}a{color:inherit}img{display:block;max-width:100%}button{font:inherit}.skip-link{position:fixed;z-index:40;left:12px;top:8px;transform:translateY(-160%);background:#fff;color:var(--burgundy);border:2px solid var(--burgundy);padding:8px 12px;font-family:"Microsoft YaHei","PingFang SC",sans-serif}.skip-link:focus{transform:translateY(0)}
    .reading-progress{position:fixed;z-index:var(--z-progress);inset:0 0 auto;height:3px;pointer-events:none}.reading-progress i{display:block;width:100%;height:100%;background:var(--burgundy);transform:scaleX(0);transform-origin:left center}
    .shell{max-width:1080px;margin:28px auto;background:var(--paper);padding:38px 48px 46px;box-shadow:0 3px 18px rgba(30,42,58,.12)}.content{min-width:0}
    .sidebar{margin:0 0 28px;padding:16px 20px;background:var(--band);border-top:1px solid var(--soft-line);border-bottom:1px solid var(--soft-line)}.brand{font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-weight:700;color:var(--heading);font-size:15px}.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}.toc{margin:10px 0 0;padding-left:22px;columns:2;column-gap:34px}.toc li{break-inside:avoid;margin:4px 0}.toc a{text-decoration:none;color:#34495e;font-size:13px}.toc a:hover,.toc a:focus-visible,.toc a.is-active{color:var(--burgundy);text-decoration:underline;text-underline-offset:3px}.toc a:focus-visible{outline:2px solid #b77a7a;outline-offset:2px}
    .hero{text-align:center;padding:0 8px 22px;border-bottom:3px solid var(--burgundy);margin-bottom:22px}.eyebrow{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--muted);font-size:12px;font-weight:700;letter-spacing:.05em}h1{font-size:28px;line-height:1.32;margin:8px 0 10px;color:#172033;text-wrap:balance}.hero p{margin:5px 0;color:#4a5568}.hero-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:5px 16px;margin-top:14px}.chip{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#405064;font-size:12px}.chip::before{content:"◆";color:var(--burgundy);font-size:8px;margin-right:5px}
    .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));border:1px solid var(--soft-line);margin:18px 0 25px}.kpi{padding:12px 14px;text-align:center;background:#fff}.kpi+.kpi{border-left:1px solid var(--soft-line)}.kpi strong{display:block;color:var(--burgundy);font:700 21px/1.25 "Microsoft YaHei","PingFang SC",sans-serif;font-variant-numeric:tabular-nums}.kpi span{color:var(--muted);font-size:12px}
    .section{scroll-margin-top:12px;margin:30px 0}.section>h2{font-size:21px;line-height:1.4;margin:0 0 16px;color:var(--heading);border-left:6px solid var(--burgundy);background:var(--band);padding:8px 12px}.section-eyebrow{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--burgundy);font-weight:700;font-size:12px;margin-bottom:4px}.section h3{font-size:17px;color:var(--heading);margin:26px 0 11px;padding-bottom:5px;border-bottom:1px dashed #c7ccd2}.section p,.section li{overflow-wrap:anywhere;text-wrap:pretty}.lead{font-size:16px;color:#2d3d50}
    .callout{background:var(--blue-soft);border-left:5px solid var(--blue);padding:14px 18px;margin:16px 0;border-radius:0 5px 5px 0}.callout.warning{background:var(--amber-soft);border-left-color:var(--amber)}.callout.danger{background:var(--red-soft);border-left-color:var(--red)}.callout.success{background:var(--green-soft);border-left-color:var(--green)}.callout strong{display:block;color:var(--heading);margin-bottom:3px}.callout p{margin:0}
    .insight-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:15px 0}.insight{border:1px solid var(--soft-line);padding:13px 15px;background:#fff}.insight .value{display:block;color:var(--burgundy);font:700 17px/1.3 "Microsoft YaHei","PingFang SC",sans-serif;font-variant-numeric:tabular-nums}.insight strong{display:block;margin-top:3px;color:var(--heading)}.insight p{margin:5px 0 0;color:var(--muted);font-size:13px}
    .figure-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.figure-grid.single{grid-template-columns:1fr}figure{margin:18px 0;border:1px solid var(--soft-line);background:#fff}.figure-media{padding:12px;display:flex;align-items:center;justify-content:center;min-height:220px;background:#fcfcfc;overflow:auto}.figure-media button{width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.figure-media button:focus-visible{outline:3px solid #9bb9d5;outline-offset:3px}.figure-media img{margin:auto;max-height:720px;object-fit:contain}.figure-wide .figure-media{justify-content:flex-start}.figure-wide .figure-media button{min-width:900px}figcaption{border-top:1px solid var(--soft-line);padding:12px 14px}figcaption strong{display:block;color:var(--heading);margin-bottom:3px}figcaption span{display:block;color:var(--muted);font-size:13px}.source{display:block;margin-top:6px;color:#718096;font-size:11px}
    .table-title{font-weight:700;color:var(--heading);margin:20px 0 8px}.table-wrap{overflow:auto;margin:0 0 8px}table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}th,td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left;overflow-wrap:anywhere}thead{display:table-header-group}thead th{background:var(--table-head);font-weight:700;text-align:center;color:#263547}.table-note{color:var(--muted);font-size:12px;margin:6px 0 14px}.citations{display:inline-flex;flex-wrap:wrap;gap:5px;margin-left:5px;vertical-align:middle}.citation{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--blue);font-size:12px;font-weight:700;text-decoration:none;border-bottom:1px solid #a9c5d9}.citation:hover{border-bottom-color:var(--blue)}.citation:focus-visible{outline:2px solid #9bb9d5;outline-offset:2px}.evidence-ref{display:block;margin-top:5px;color:#66788d;font:12px/1.55 "Microsoft YaHei","PingFang SC",sans-serif}
    .conclusion{font-size:16px;background:var(--blue-soft);border-left:5px solid var(--blue);padding:16px 18px}.foot{color:var(--muted);font-size:12px;text-align:center;border-top:1px solid var(--soft-line);padding-top:18px;margin-top:36px}.back{display:inline-block;margin-top:12px;color:var(--burgundy);font-size:12px;text-decoration:none}.back:hover{text-decoration:underline}
    dialog.image-viewer{z-index:var(--z-dialog);width:min(96vw,1500px);height:min(94vh,1000px);padding:18px;border:0;border-radius:6px;background:#fff;box-shadow:0 18px 60px rgba(0,0,0,.35)}dialog.image-viewer::backdrop{background:rgba(20,25,33,.9)}.viewer-bar{display:flex;justify-content:flex-end;margin-bottom:10px}.viewer-close{border:1px solid var(--line);background:#fff;color:var(--heading);font-weight:700;padding:8px 13px;cursor:pointer}.viewer-close:hover{background:var(--band)}.viewer-close:focus-visible{outline:3px solid #9bb9d5;outline-offset:3px}.viewer-body{height:calc(100% - 48px);overflow:auto;display:grid;place-items:center;background:#fafafa}.viewer-body img{max-width:none;max-height:none;width:auto;height:auto;background:#fff}
    @media(max-width:850px){.shell{margin:0;padding:25px 24px;box-shadow:none}.toc{columns:1}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi:nth-child(odd){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--soft-line)}.figure-grid{grid-template-columns:1fr}.insight-grid{grid-template-columns:1fr}}
    @media(max-width:700px){body{background:#fff}.shell{padding:18px 16px}.hero{padding-left:0;padding-right:0}h1{font-size:24px}.section>h2{font-size:19px}.sidebar{padding:13px 15px}.kpis{grid-template-columns:1fr}.kpi+.kpi{border-left:0;border-top:1px solid var(--soft-line)}.figure-wide .figure-media button{min-width:700px}.table-wrap{max-width:100%;-webkit-overflow-scrolling:touch}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
    @media print{@page{size:A4;margin:16mm 14mm}body{background:#fff;font-size:11pt}.skip-link,.reading-progress,dialog.image-viewer,.back{display:none!important}.shell{max-width:none;margin:0;padding:0;box-shadow:none}.sidebar{break-inside:avoid}.hero,.section>h2,figure,.callout,.insight{break-inside:avoid}.section{break-before:auto}.figure-wide .figure-media button{min-width:0}.table-wrap{overflow:visible}a[href^="http"]::after{content:""}}
  </style>
</head>
<body id="top">
  <a class="skip-link" href="#report-content">跳到报告正文</a>
  <div class="reading-progress" aria-hidden="true"><i></i></div>
  <div class="shell">
    <main class="content" id="report-content" tabindex="-1">{{CONTENT}}</main>
  </div>
  <dialog class="image-viewer" aria-label="分析图片放大预览">
    <div class="viewer-bar"><button class="viewer-close" type="button">关闭预览</button></div>
    <div class="viewer-body"><img alt="放大的分析图片"></div>
  </dialog>
  <script>
    (()=>{const progress=document.querySelector('.reading-progress i');const links=[...document.querySelectorAll('.toc a[href^="#"]')];const sections=links.map(link=>document.querySelector(link.getAttribute('href'))).filter(Boolean);
      const updateProgress=()=>{const room=document.documentElement.scrollHeight-window.innerHeight;const ratio=room>0?Math.min(1,Math.max(0,window.scrollY/room)):0;progress.style.transform=`scaleX(${ratio})`};window.addEventListener('scroll',updateProgress,{passive:true});updateProgress();
      if('IntersectionObserver' in window){const observer=new IntersectionObserver(entries=>{for(const entry of entries){if(!entry.isIntersecting)continue;for(const link of links)link.classList.toggle('is-active',link.getAttribute('href')===`#${entry.target.id}`)}},{rootMargin:'-18% 0px -70% 0px'});for(const section of sections)observer.observe(section)}
      const dialog=document.querySelector('.image-viewer');const viewerImage=dialog.querySelector('img');const closeButton=dialog.querySelector('.viewer-close');let returnFocus=null;
      for(const button of document.querySelectorAll('[data-image-viewer]'))button.addEventListener('click',()=>{returnFocus=button;const source=button.querySelector('img');viewerImage.src=source?.src||'';viewerImage.alt=source?.alt||'放大的分析图片';dialog.showModal();closeButton.focus()});
      closeButton.addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});dialog.addEventListener('cancel',event=>{event.preventDefault();dialog.close()});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&dialog.open){event.preventDefault();dialog.close()}});dialog.addEventListener('close',()=>{viewerImage.removeAttribute('src');returnFocus?.focus()});
    })();
  </script>
</body>
</html>
